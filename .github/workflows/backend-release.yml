name: Backend Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify package candidate
        run: |
          uv run ruff check .
          uv run pytest
          mkdir -p data
          uv run alembic current

      - name: Build backend archive
        run: |
          mkdir -p ../dist
          tar \
            --exclude=".venv" \
            --exclude=".pytest_cache" \
            --exclude=".ruff_cache" \
            --exclude="__pycache__" \
            --exclude="data" \
            -czf ../dist/mwoham-backend-${{ github.ref_name }}.tar.gz \
            .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwoham-backend-${{ github.ref_name }}
          path: dist/mwoham-backend-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "../dist/mwoham-backend-${{ github.ref_name }}.tar.gz" \
            --title "${{ github.ref_name }}" \
            --notes "Backend package for local FastAPI service."

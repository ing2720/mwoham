name: Backend CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run checks without DevEvent recording
        working-directory: backend
        run: uv run python scripts/run_dev_checks.py --no-record

      - name: Run coverage
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
